<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Колода · Угадай болезнь</title>
<meta name="robots" content="noindex">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/fonts.css">
<style>
/* Review page for the deck: every card with its character, name and hints. Not linked from the game. */
:root{
  --g-tile:#D5EFE5; --g-grout:#BCE2D3; --g-ink:#24193B; --g-paper:#FFFFFF; --g-muted:#685F7E;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-hand:'Caveat','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0; background-color:var(--g-tile); background-image:linear-gradient(var(--g-grout) 2px, transparent 2px), linear-gradient(90deg, var(--g-grout) 2px, transparent 2px); background-size:44px 44px; color:var(--g-ink); font-family:var(--f-body); padding:calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px))}
main{max-width:1180px; margin:0 auto; display:grid; gap:18px}
h1{font:900 clamp(26px, 6vw, 38px)/1.1 var(--f-display); margin:0}
.lede{margin:0; font-weight:700; color:var(--g-muted); max-width:62ch}
.lede a{color:inherit}
h2{font:800 18px var(--f-display); margin:14px 0 0; display:flex; align-items:center; gap:10px}
h2 i{width:20px; height:20px; border-radius:50%; border:2.5px solid var(--g-ink); display:inline-block}
h2 small{font:700 14px var(--f-body); color:var(--g-muted)}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:14px}
.dcard{background:var(--g-paper); border:2.5px solid var(--g-ink); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 5px 0 rgba(36,25,59,.18)}
.art{background:var(--sys); aspect-ratio:200/180; border-bottom:2.5px solid var(--g-ink)}
.art svg{width:100%; height:100%; display:block}
.nm{font:800 15px/1.15 var(--f-display); padding:10px 12px 2px; overflow-wrap:anywhere}
.lbl{font:700 19px/1 var(--f-hand); color:var(--g-muted); padding:4px 12px 0}
ul{margin:0; padding:4px 12px 12px 28px; font:700 13.5px/1.35 var(--f-body)}
</style>
</head>
<body>
<main>
  <h1>Колода</h1>
  <p class="lede" id="lede"></p>
  <div id="deck"></div>
</main>
<script type="module">
import {CARDS} from './js/cards.js';
import {SYSTEMS} from './js/config.js';
import {artSVG} from './js/art.js';

document.getElementById('lede').innerHTML = `${CARDS.length} карточек по системам органов. Подсказки видит только объясняющий. <a href="./">К игре</a>`;
document.getElementById('deck').innerHTML = Object.entries(SYSTEMS).map(([key, sys]) => {
  const cards = CARDS.filter(c => c.sys === key);
  return `<h2><i style="background:${sys.color}"></i>${sys.name} <small>${cards.length}</small></h2><div class="grid">` +
    cards.map(c => `<article class="dcard" style="--sys:${sys.color}"><div class="art">${artSVG(c)}</div><div class="nm">${c.name}</div><div class="lbl">Жалобы:</div><ul>${c.hints.map(h => `<li>${h}</li>`).join('')}</ul></article>`).join('') +
    '</div>';
}).join('');
</script>
</body>
</html>
